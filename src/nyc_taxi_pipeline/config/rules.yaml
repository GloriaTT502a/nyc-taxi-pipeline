# src/nyc_taxi_pipeline/config/rules.yaml
rules:
  - name: missing_pickup
    expr: "{COL_PU_DATETIME_UTC} IS NULL"
  
  - name: missing_dropoff
    expr: "{COL_DO_DATETIME_UTC} IS NULL"
  
  - name: dropoff_before_pickup
    expr: "{COL_PU_DATETIME_UTC} IS NOT NULL AND {COL_DO_DATETIME_UTC} IS NOT NULL AND {COL_DO_DATETIME_UTC} < {COL_PU_DATETIME_UTC}"
  
  - name: passenger_count_invalid
    expr: "{COL_PASSENGER_COUNT} < 0 OR {COL_PASSENGER_COUNT} > 9"
  
  - name: total_amount_negative
    expr: "{COL_TOTAL_AMOUNT} < 0.0"
  
  - name: invalid_YYYYMM
    expr: "{PARTITION_COL_YYYYMM} < 190001 OR {PARTITION_COL_YYYYMM} > 300012"
  
  - name: duration_out_of_range
    expr: "{COL_DURATION_MIN} < 2.0 OR {COL_DURATION_MIN} > 180.0"
  
  - name: distance_too_small
    expr: "{COL_TRIP_DISTANCE} <= 0.1"
  
  - name: efficiency_too_high
    expr: "{COL_FARE_PER_MINUTE} >= 15.0"
  
  - name: fare_too_low
    expr: "{COL_FARE_AMOUNT} <= 2.5"