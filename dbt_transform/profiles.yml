# 文件路径: dbt_transform/profiles.yml

dbt_transform:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: nyc
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      schema: dev 
      auth_type: oauth
      profile: DEFAULT
      threads: 4

    ci_pipeline: 
      type: databricks

      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      auth_type: pat

      catalog: nyc
      schema: dev

      threads: 4

    # 3. 生产环境 (对应pr_test.yml Job 4)
    prod_pipeline:
      type: databricks
      catalog: nyc
      # 注意这里：这是真实的生产 schema，只有合并到 main 才能写这里
      schema: prod 
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      auth_type: pat
      
      threads: 16 
