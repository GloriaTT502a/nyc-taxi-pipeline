
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'nyc_taxi_pipeline'
version: '1.0.0'

# This setting configures in ~/.dbt/profiles.yml which "profile" dbt uses for this project.
profile: 'dbt_transform'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  nyc_taxi_pipeline:
    # Config indicated by + and applies to all files under models/example/
    staging: 
      +schema: staging
      +materialized: view 
      +tags: ["daily_batch", "layer_staging"]

    intermediate: 
      +schema: intermediate 
      +materialized: view
      +tags: ["daily_batch", "layer_intermediate"]
    
    marts: 
      +schema: marts 
      +materialized: table 
      +tags: ["daily_batch", "layer_marts"]

    
    observability: 
      +schema: audits
      # 探查数据必须物理固化
      +materialized: table
      +tags: ["monitoring", "layer_observability"]


vars:
  dq_rules:
    # 财务 MTA Tax 校验逻辑
    # 4 = Disputed
    # 6 = Voided trip (作废订单)
    # 当一笔订单处于 Disputed 或 Voided 状态时，为了在账目上清零，系统会自动发送一个反向的 -0.50 MTA 税记录。
    mta_tax_validation: >
      (mta_tax_amount in (0.00, 0.50)) 
      or (mta_tax_amount = -0.50 and payment_type in (4, 6))
      

seeds:
  nyc_taxi_pipeline:
    +quote_columns: false 