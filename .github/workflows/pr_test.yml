name: Data Pipeline CI (PySpark & dbt)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pyspark-unit-tests:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'       # 🌟 升级至 Java 17，与高版本生态及本地环境保持字节码一致
        distribution: 'temurin'  # 现代工业级最推荐、最稳定的开源 JDK 发行版

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"   # 🌟 对齐 Python 3.11 运行时
        cache: 'pip'             # 开启 GitHub 官方构建缓存，大幅缩短后续 CI 的排队时间

    - name: Install System Spatial Dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gdal-bin \
          libgdal-dev \
          libgeos-dev \
          libproj-dev \
          --no-install-recommends

    - name: Install Python deps (Local ONLY)
      run: |
        python -m pip install --upgrade pip
        # Install test in pyproject.yml ONLY 
        pip install -e ".[test]"


    - name: Run Pytest
      env:
        # 1. 强行注入本地数据工程测试的“双重免死金牌”
        USE_LOCAL_SPARK: "true"   # 降维打击：强行让项目激活内部原生本地纯净 Spark 引擎
        USE_PANDAS_UDF: "false"   # 确定性优先：在测试容器内关闭 Pandas UDF，彻底绕开高版本 Java Unsafe 闪退死锁
        RUNTIME_ENV: "local"
        # 2. 【本次修复核心】：注入 Mock 凭证，彻底致盲 Databricks SDK 的云端联调探测机制
        DATABRICKS_HOST: "https://local-isolated-testing.cloud.databricks.com"
        DATABRICKS_TOKEN: "mock_token"
      run: |
        # 运行全量单元测试，并关闭本地缓存提供者，确保每次 CI 运行都是绝对干净的冷启动
        pytest tests/ -v -p no:cacheprovider

    # ==========================================
    # 第二防线：dbt 逻辑与集成测试
    # ==========================================
  dbt-offline-checks: 
    runs-on: ubuntu-22.04 
    steps:
    - uses: actions/checkout@v4 

    - uses: actions/setup-python@v5  
      with: 
        python-version-file: ".python-version" 
        cache: 'pip' 

    - name: Install dbt & SQLFluff
      run: |
        python -m pip install --upgrade pip
        # Install deps for dbt in pyproject ONLY
        pip install -e ".[dbt]"


    - name: dbt Compile (NO CLOUD) 
      working-directory: ./dbt_transform 
      env: 
        DBT_PROFILES_DIR: .
        # 编译阶段不需要真实 Serverless，随便给个假地址即可验证 Jinja 语法
        DATABRICKS_HOST: "https://mock.databricks.com"
        DATABRICKS_TOKEN: "mock_token"
        DATABRICKS_HTTP_PATH: "mock/path" 
      run: | 
        dbt deps 
        dbt compile 

# dbt CLOUD integration (Pull Request ONLY)

  dbt-cloud-integration: 
    # 核心防御：必须等前面两个纯本地 Job 成功后才运行，防浪费！ 
    needs: [pyspark-unit-tests, dbt-offline-checks] 
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04 
    env: 
      DBT_PROFILES_DIR: .
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}

    steps: 
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"
        cache: 'pip'

    - name: Install dbt 
      working-directory: ./dbt_transform 
      run: | 
        python -m pip install --upgrade pip
        pip install -e ".[dbt]"


    - name: Connection Check & Unit Tests
      working-directory: ./dbt_transform
      run: |
        dbt deps
        dbt debug --target ci_pipeline
        # dbt 的 Unit Test 需要连接云端解析特定的 Databricks SQL 方言
        dbt test --target ci_pipeline --select "test_type:unit" 

    - name: Download state (Safe)
      uses: dawidd6/action-download-artifact@v2
      continue-on-error: true
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: pr_test.yml
        branch: main
        name: dbt-manifest
        path: ./dbt_transform/prod-state 

    - name: Run Slim CI Build
      working-directory: ./dbt_transform
      run: |
        dbt deps 
        if [ -f "./prod-state/manifest.json" ]; then
          dbt build \
            --target ci_pipeline \
            --select "state:modified+" \
            --state ./prod-state \
            --defer
        else
          # 退化为仅运行数据测试，确保不执行全库重构
          dbt test --target ci_pipeline --exclude "test_type:unit"
        fi 

# Production publish and status update (For Push ONLY)
  dbt-prod-build-and-state-update: 
    # ONly run if code merge to main branch 
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' 
    # Need basic test 
    needs: [pyspark-unit-tests, dbt-offline-checks] 
    runs-on: ubuntu-22.04 
    env: 
      DBT_PROFILES_DIR: .
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }} 

    steps: 
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"
        cache: 'pip' 

    - name: Install dbt 
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dbt]" 

    - name: Run Full Production Build
      working-directory: ./dbt_transform
      run: |
        dbt deps
        # Production Environment 
        dbt build --target prod_pipeline 

    - name: Upload latest manifest.json
      # 核心收尾：无论前面构建成功与否（通常需要成功），都要把最新的产物存起来
      uses: actions/upload-artifact@v4
      with:
        name: dbt-manifest
        # 这个文件是 dbt 运行后自动生成在 target 目录下的
        path: ./dbt_transform/target/manifest.json
        # 状态文件不需要永久保存，保留 30 天足够后续 PR 使用了
        retention-days: 30

    