[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc_taxi_pipeline"
version = "0.1.3"
description = "NYC Taxi Data Engineering Pipeline on Databricks"
requires-python = ">=3.10"

# =========================================
#  PRODUCTION DEPENDENCIES (Databricks Runtime)
# =========================================
dependencies = [
    # core utils
    "pyyaml==6.0.2",
    "python-dateutil==2.9.0.post0",

    # data stack
    "pandas",
    "numpy",

    # spatial stack
    "pyshp==2.3.1",
    "shapely==2.0.6",
    "pyproj==3.6.1"  
]


[project.scripts]
run_bronze = "nyc_taxi_pipeline.jobs.run_bronze:main"
run_silver = "nyc_taxi_pipeline.jobs.run_silver:main"
run_build_zone_lookup = "nyc_taxi_pipeline.jobs.run_spatial:run"

# =========================================
#  DEV ENV (local only)
# =========================================
[project.optional-dependencies]
dev = [
    "databricks-connect==18.2.1",
    "pytest>=7.0.0",
    "pytest-cov",
    "chispa",
    "pytest-dotenv", 


    # ONLY for local heavy geo testing
    "geopandas==0.14.4"
]

# =========================================
#  CI TEST ENV
# =========================================
test = [
    "pyspark==3.5.1",
    "delta-spark==3.1.0",
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "pytest-dotenv",
    "chispa==0.10.1",
    "databricks-sdk==0.28.0"
]

# =========================================
# dbt ENV
# =========================================
dbt = [
    "dbt-databricks==1.12.0",
    "sqlfluff==3.0.0",
    "sqlfluff-templater-dbt==3.0.0"
]

# =========================================
# pytest config
# =========================================
[tool.pytest.ini_options]
filterwarnings = [
    "ignore:ReleaseExecute failed with exception:UserWarning:pyspark.sql.connect.client.reattach",
    "ignore:distutils Version classes are deprecated:DeprecationWarning:pyspark.sql.pandas.utils",
    "ignore:distutils Version classes are deprecated:DeprecationWarning:pyspark.sql.connect.utils"
]
env_files = [".env"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nyc_taxi_pipeline.config" = ["*.yaml", "*.yml"] 
